# Builds the RoadWatch Android App Bundle (AAB) in GitHub Actions.
# The AAB is uploaded UNSIGNED on purpose: signing with the upload key
# happens locally after download (see keystore.properties, kept out of git).
name: Build AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-aab.yml'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'tsconfig.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub runners already ship the Android SDK; just make sure the
      # exact platform and build-tools the app targets are installed.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found"; ls "$ANDROID_HOME"; exit 1; fi
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      - run: npm ci
      - run: npm run build
      # The native Android shell is generated fresh in CI (keeps binary
      # splash/icon assets out of git); the unsigned AAB is what we want.
      - run: npx cap add android
      - run: npx cap sync android

      - name: Build release AAB (unsigned)
        working-directory: android
        run: gradle bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: roadwatch-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
